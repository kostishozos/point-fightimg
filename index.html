<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Point Fighter</title>
<meta name="theme-color" content="#4b1fa6">
<meta name="description" content="Arcade point fighting: reverse punch, blitz, side kick, head kick.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Point Fighter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: loud arcade cabinet, tournament night
   IDEA: a point-fighting tournament mat under arena lights
   PICTURE: the game canvas itself, full screen
   COLOUR and TYPE: arena navy, mat blue, red vs blue fighters, gold accent; Bungee + Barlow
   LAYOUT: canvas fills the screen, touch controls sit below (portrait) or over the corners (landscape) */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#070a14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Barlow,system-ui,sans-serif;color:#fff}
#wrap{position:fixed;inset:0}
canvas{position:absolute;display:block}
#controls{position:absolute;left:0;right:0;bottom:0;height:250px;pointer-events:none}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font:400 13px/1.05 Bungee,system-ui,sans-serif;pointer-events:auto;touch-action:none;border:3px solid rgba(255,255,255,.6);text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.45);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn small{font:700 11px Barlow,sans-serif;opacity:.85;margin-top:3px}
/* phone: left stick moves, right stick kicks (forward side kick, up head kick, back defensive kick), buttons punch/blitz */
.stick{position:absolute;bottom:22px;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04),rgba(255,255,255,.12));border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:39px;top:39px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.42);box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:none}
#moveStick{left:18px}#kickStick{right:18px;border-color:rgba(255,210,90,.6);background:radial-gradient(circle,rgba(255,210,90,.06),rgba(255,210,90,.16))}
.sl{position:absolute;font:400 10px Bungee,system-ui,sans-serif;color:#ffd25a;pointer-events:none;text-shadow:0 1px 0 #000}
.sl.u{top:6px;left:0;right:0;text-align:center}.sl.l{left:6px;top:58px}.sl.r{right:6px;top:58px}
#punchBtn{right:94px;bottom:166px;width:72px;height:72px;background:radial-gradient(circle at 35% 30%,#7fe3ff,#0a8fd0);font-size:11px}
#blitzBtn{right:16px;bottom:166px;width:72px;height:72px;background:radial-gradient(circle at 35% 30%,#ff9d8a,#d23a2a);font-size:12px}
.btn.on{transform:scale(.9);filter:brightness(1.3)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;background:radial-gradient(ellipse at 50% 28%,rgba(150,80,240,.62),rgba(58,22,110,.92) 55%,rgba(16,6,34,.97) 100%);text-align:center;padding:24px;gap:10px}
.wide{width:min(300px,82vw)}.cpu{background:#1f6fe0}.setb{background:#6a44b0}.rulesb{background:#3a2f5c}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(340px,88vw);font:700 17px Barlow,sans-serif;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.set input[type=range]{width:150px;accent-color:#ffd25a}.set output{display:inline-block;min-width:3.2em;text-align:right;color:#ffd25a}
.tog{font:400 13px Bungee,system-ui,sans-serif;min-height:40px;min-width:76px;border-radius:10px;border:0;color:#fff;background:#3a2f5c;cursor:pointer}.tog[aria-pressed=true]{background:#2a9d5c}
.rules{max-width:44ch;text-align:left;font-size:15px;line-height:1.5;margin:0;padding-left:1.2em}.rules li{margin:3px 0}.rules b{color:#ffd25a}
h2.sec{font:400 18px Bungee,system-ui,sans-serif;color:#c9a6ff;margin:10px 0 2px}
#overlay.hide{display:none}
#codeIn{font:400 22px Bungee,system-ui,sans-serif;width:140px;min-height:48px;text-align:center;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:#0b1430;color:#fff;text-transform:uppercase;letter-spacing:4px;-webkit-user-select:text;user-select:text}
#codeIn:focus-visible{outline:3px solid #ffd25a;outline-offset:2px}
.online{background:#7a3fd0}.grey{background:#3a4256}
.code{font:400 44px Bungee,system-ui,sans-serif;letter-spacing:8px;color:#ffd25a;margin:0}
h1{font:400 clamp(34px,9vw,58px)/1.02 Bungee,system-ui,sans-serif;margin:0;color:#ffd25a;text-shadow:0 4px 0 #b33a1a,0 8px 24px rgba(0,0,0,.6)}
.sub{font-size:17px;opacity:.9;margin:0 0 6px;max-width:34ch}
.how{font-size:15px;line-height:1.5;opacity:.85;max-width:38ch;margin:4px 0 10px}
.how b{color:#ffd25a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.pick{font:400 15px Bungee,system-ui,sans-serif;min-height:48px;padding:10px 20px;border-radius:12px;border:0;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
button.pick:focus-visible{outline:3px solid #fff;outline-offset:3px}
.easy{background:#2a9d5c}.normal{background:#1f6fe0}.hard{background:#d23a2a}.again{background:#e08a00}
.big{font:400 clamp(30px,8vw,50px)/1.05 Bungee,system-ui,sans-serif;margin:0}
.score{font:700 22px Barlow,sans-serif;margin:0 0 8px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="controls">
    <div class="stick" id="moveStick"><div class="knob"></div></div>
    <div class="stick" id="kickStick"><div class="knob"></div><span class="sl u">HEAD ▲</span><span class="sl l" id="kl">◀ DEF</span><span class="sl r" id="kr">SIDE ▶</span></div>
    <div class="btn" id="punchBtn">REVERSE<small>+1</small></div>
    <div class="btn" id="blitzBtn">BLITZ<small>+1</small></div>
  </div>
  <div id="overlay"></div>
</div>
<script src="game.js"></script>
</body>
</html>
